services:
  svnhub:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SVNHUB_UID: ${SVNHUB_UID:-10001}
      SVNHUB_GID: ${SVNHUB_GID:-10001}
      SVNHUB_FIX_OWNERSHIP: ${SVNHUB_FIX_OWNERSHIP:-0}
      SvnHub__MaxPreviewBytes: ${SVNHUB_MAX_PREVIEW_BYTES:-52428800}
      SvnHub__McpAllowedOrigins__0: ${SVNHUB_MCP_ALLOWED_ORIGIN:-}
      SvnHub__ApacheReloadProgram: ""
      SvnHub__ApacheReloadArguments: ""
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ${SVNHUB_DATA}:/var/lib/svnhub/data
      - ${SVNHUB_REPOS}:/var/lib/svnhub/repos
    restart: unless-stopped
